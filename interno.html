<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Interno</title>

    <style>
        body {
            background-color: #f0f8ff;
        }

        h1 {
            color: purple;
        }

        p {
            color: darkgreen;
        }
    </style>
</head>

<body>
    <header>
        <h1>CSS Interno</h1>
    </header>

    <main>
        <p>
            Esta página utiliza CSS interno, escrito dentro da tag style.
        </p>

        <a href="index.html">Voltar ao menu</a>
    </main>

    <footer>
        <p>Laboratório de CSS</p>
    </footer>
</body>

</html>
